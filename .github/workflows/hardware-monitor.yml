name: Vibe Wise Monitor (Windows build)

on:
  push:
    paths: ['HardwareMonitor/**', '.github/workflows/hardware-monitor.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish (exe único, autocontenido)
        run: dotnet publish HardwareMonitor/VibeWiseMonitor.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: VibeWiseMonitor-win-x64
          path: out/VibeWiseMonitor.exe
